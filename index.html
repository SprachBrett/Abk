<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honorarnote</title><style>body{font-family:Arial;background:#f1f6f3;color:#183b37;margin:0}.wrap{max-width:850px;margin:32px auto;padding:18px}.head{background:linear-gradient(120deg,#123b35,#319474);color:white;padding:26px;border-radius:20px}.card{background:white;padding:22px;border-radius:16px;margin-top:16px;box-shadow:0 8px 28px #183b3714}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;font-size:13px;display:block;margin:8px 0 5px}input,select{width:100%;box-sizing:border-box;height:40px;border:1px solid #ccd9d2;border-radius:8px;padding:8px;font:inherit}button{background:#176b57;color:white;border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer}.row{display:flex;gap:10px;align-items:end;margin-top:10px}.session{padding:9px;border-bottom:1px solid #e8efeb}.hint{font-size:12px;color:#60756c;line-height:1.5}.full{grid-column:1/-1}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-wrap:wrap}}</style><main class="wrap"><header class="head"><h1>Honorarnote erstellen</h1><div>Die Rechnung wird direkt in Ihrer Original-Word-Vorlage ausgefüllt.</div></header><form id="f" class="card"><h2>Patientendaten</h2><div class="grid"><div><label>Anrede</label><select name="salutation"><option>Frau</option><option>Herr</option><option>Divers</option></select></div><div><label>Name *</label><input name="name" required></div><div><label>Adresse</label><input name="street"></div><div><label>Postleitzahl, Ort</label><input name="zipcity"></div><div><label>Versicherungsnummer</label><input name="insurance"></div><div><label>Honorarnote</label><input name="invoice_no"></div><div><label>Rechnungsdatum</label><input name="invoice_date" type="date"></div><div><label>Umfang</label><select name="plan"><option value="10">1x/10x – eine Serie mit 10 Terminen</option><option value="6">6x/6x – sechs Serien mit je 6 Terminen</option></select></div><div class="full"><h2>Therapietermine</h2><div class="row"><div><label>Datum</label><input id="date" type="date"></div><button type="button" id="add">Termin hinzufügen</button></div><div id="list"></div></div><div><label>Preis pro Termin (€)</label><input name="price" type="number" step="0.01" value="46.00"></div><div><label>Geldinstitut</label><input name="bank"></div></div><button style="width:100%;margin-top:20px" type="submit">Word-Rechnung aus Originalvorlage herunterladen</button><p id="status"></p></form><p class="hint">Lokal auf diesem Computer. Patientendaten werden nicht ins Internet übertragen.</p></main><script>const ds=[];const f=document.querySelector('#f');document.querySelector('[name=invoice_date]').value=new Date().toISOString().slice(0,10);function draw(){document.querySelector('#list').innerHTML=ds.map((d,i)=>'<div class="session">'+new Date(d+'T12:00:00').toLocaleDateString('de-AT')+' <button type="button" data-i="'+i+'">Entfernen</button></div>').join('')||'<p class="hint">Noch keine Termine.</p>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ds.splice(+b.dataset.i,1);draw()})}document.querySelector('#add').onclick=()=>{let d=document.querySelector('#date').value;if(!d)return alert('Datum auswählen.');ds.push(d);ds.sort();draw()};f.onsubmit=async e=>{e.preventDefault();if(!ds.length)return alert('Mindestens einen Termin erfassen.');let x=new FormData(f);x.set('sessions',JSON.stringify(ds));let s=document.querySelector('#status');s.textContent='Erstelle Word-Rechnung …';try{let r=await fetch('/generate',{method:'POST',body:new URLSearchParams(x)});if(!r.ok)throw Error(await r.text());let a=document.createElement('a'),u=URL.createObjectURL(await r.blob());a.href=u;a.download='Honorarnote.docx';a.click();URL.revokeObjectURL(u);s.textContent='Fertig: Rechnung wurde aus der Originalvorlage erstellt.'}catch(err){s.textContent='Fehler: '+err.message}};draw()</script></html>
